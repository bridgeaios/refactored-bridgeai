[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF"]
ignore = [
    "E501",
    "RUF001",  # ambiguous unicode in strings (intentional math notation: ×, →, –)
    "RUF002",  # ambiguous unicode in docstrings (intentional)
    "RUF003",  # ambiguous unicode in comments (intentional)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/main.py" = ["E402"]        # env loading must precede app imports
"app/runtime.py" = ["E402"]     # priority routing + treasury wired after services created
"app/services/emotion.py" = ["N812"]    # torch.nn.functional as F is PyTorch convention
"app/services/learning.py" = ["N806"]  # X is standard ML notation for feature matrix

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
