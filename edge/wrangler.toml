name = "bridge-edge"
main = "worker.js"
compatibility_date = "2024-01-01"

[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.secrets]]
name = "JWT_SECRET"
id = "jwt_secret"

[[env.production.secrets]]
name = "JWT_PUBLIC_KEY"
id = "jwt_public_key"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[[unsafe.bindings]]
name = "BACKEND_URL"
type = "plain_text"
value = "http://backend:8000"

[observability]
enabled = true
log_level = "info"

# BRIDGE-AI-OS.COM (Main Economic Platform)
[[routes]]
pattern = "bridge-ai-os.com/*"
zone_name = "bridge-ai-os.com"

[[routes]]
pattern = "www.bridge-ai-os.com/*"
zone_name = "bridge-ai-os.com"

[[routes]]
pattern = "bridge-ai-os.co.za/*"
zone_name = "bridge-ai-os.com"

[[routes]]
pattern = "bridge-ai-os.org/*"
zone_name = "bridge-ai-os.com"

[[routes]]
pattern = "bridge-ai-os.tech/*"
zone_name = "bridge-ai-os.com"

[[routes]]
pattern = "bridge-ai-os.xyz/*"
zone_name = "bridge-ai-os.com"

# SUPACO.IO (Command Layer)
[[routes]]
pattern = "supaco.io/*"
zone_name = "supaco.io"

[[routes]]
pattern = "www.supaco.io/*"
zone_name = "supaco.io"

[[routes]]
pattern = "supaco.ai/*"
zone_name = "supaco.io"

[[routes]]
pattern = "supaco.co.za/*"
zone_name = "supaco.io"

[[routes]]
pattern = "supaco.team/*"
zone_name = "supaco.io"

[[routes]]
pattern = "supaco.tech/*"
zone_name = "supaco.io"

[[routes]]
pattern = "supaco.xyz/*"
zone_name = "supaco.io"

# AI-OS.CO.ZA (Treasury - Zero Trust)
[[routes]]
pattern = "ai-os.co.za/*"
zone_name = "ai-os.co.za"
