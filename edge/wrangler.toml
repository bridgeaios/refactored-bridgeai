name = "bridge-edge"
main = "worker.js"
compatibility_date = "2024-01-01"

[env.production]
vars = { ENVIRONMENT = "production" }

[env.staging]
vars = { ENVIRONMENT = "staging" }

[[unsafe.bindings]]
name = "BACKEND_URL"
type = "plain_text"
value = "http://backend:8000"

[observability]
enabled = true
log_level = "info"

# Routes
[[routes]]
pattern = "supaco.io/*"
zone_name = "supaco.io"

[[routes]]
pattern = "www.supaco.io/*"
zone_name = "supaco.io"
