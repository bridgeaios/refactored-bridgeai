# Bridge AI OS — Unified Production Docker Compose
# All services consolidated under Caddy reverse proxy with auto-HTTPS.
# Usage: docker compose -f docker-compose.unified.yml --env-file .env.unified up -d

services:
  # ─── Reverse Proxy ───────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bridge-unified
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  # ─── Backend API (FastAPI) ───────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:8000"
    env_file:
      - .env.unified
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bridge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bridge_ai}
      - DB_HOST=postgres
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - BRIDGE_WEBHOOK_KEY=${BRIDGE_WEBHOOK_KEY}
      - BRIDGE_DEV_SECRET=${BRIDGE_DEV_SECRET}
      - BRIDGE_INTERNAL_TOKEN=${BRIDGE_INTERNAL_TOKEN}
      - BRIDGE_SIWE_JWT_SECRET=${BRIDGE_SIWE_JWT_SECRET}
      - BRIDGE_INTERNAL_SECRET=${BRIDGE_INTERNAL_SECRET}
      - BRIDGE_SECRETS_ROTATED=${BRIDGE_SECRETS_ROTATED:-1}
      - ELEVEN_API_KEY=${ELEVENLABS_API_KEY}
      - PROMETHEUS_ENABLED=true
      - ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/api/health',timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bridge-unified

  # ─── Frontend (Vite/Node) ────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:9002:3000"
    env_file:
      - .env.unified
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:8000
      - VITE_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bridge-unified

  # ─── Auth Service — stub until bridge-auth Dockerfile is added ─────
  # auth: (disabled — ./bridge-auth has no Dockerfile yet)

  # ─── State Loop — disabled (module not present in this repo) ──────
  # state_loop:
  #   build: ./backend
  #   command: python -m state_loop

  # ─── SVG Skill Engine — stub until ../svg-engine exists on VPS ─────
  # svg_engine: (disabled — ../svg-engine not present in this repo)

  # ─── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    expose:
      - "5432"
    env_file:
      - .env.unified
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bridge} -d ${POSTGRES_DB:-bridge_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bridge-unified

  # ─── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - bridge-unified

  # ─── Neo4j ──────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.14-community
    restart: unless-stopped
    expose:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - bridge-unified

  # ─── Prometheus ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bridge-unified

  # ─── Grafana ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://monitor.bridge-ai-os.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning
      - ./monitoring/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - bridge-unified

  # ─── Redis Exporter ────────────────────────────────���──────────────
  redis_exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    expose:
      - "9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bridge-unified

  # ─── Postgres Exporter ─────────────────────────────────────────��──
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    expose:
      - "9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER:-bridgeai}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-bridgeai_unified}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bridge-unified

# ─── Volumes ─────────────────────────────────────────────────���──────
volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  prometheus_data:
  grafana_data:

# ─── Network ───────────────────────────────────────────────────────
networks:
  bridge-unified:
    driver: bridge
