[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# FastAPI-style `Depends(...)` in parameter defaults triggers B008; it's expected here.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Legacy service files — these are excluded from this domain refactor milestone.
"backend/app/services/*.py" = ["F401"]
"backend/app/domains/*/models.py" = []
