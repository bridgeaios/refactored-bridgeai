services:
  backend:
    build: ./backend
    ports:
      - "8081:8000"
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BRIDGE_ENV=development
      # L9 secrets guard — required for boot (local Docker only; use real secrets in prod / .env)
      - BRIDGE_SIWE_JWT_SECRET=a772f9c3b4e84d2f1a90658c7d3e0b1f4c8d9e2a7f50639487acbdef01234567
      - BRIDGE_INTERNAL_SECRET=b8830ad4c5f951e32b81769d4e1f2a305b9c0d8e7f615243968a7bcdef0123456
      - ELEVEN_API_KEY=
      - PROMETHEUS_ENABLED=true
      # DB lives in the unified stack — uses service hostname on bridge-unified network
      - DATABASE_URL=postgresql+asyncpg://bridge:bridge_dev_password@postgres:5432/bridge_ai
    networks:
      - default
      - bridge-unified
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8001:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docs/grafana-dashboard-swarm.json:/var/lib/grafana/dashboards/swarm.json
    depends_on:
      - prometheus

  neo4j:
    image: neo4j:5.14-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=['apoc']
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    depends_on:
      - backend

volumes:
  prometheus_data:
  grafana_data:
  neo4j_data:
  neo4j_logs:

networks:
  bridge-unified:
    external: true
    name: bridgelivewall_bridge-unified
