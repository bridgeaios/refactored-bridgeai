version: "3.9"
services:
  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      - EDGE_MODE=required
    volumes:
      - ./data:/data
    networks:
      - bridge-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - bridge-net

networks:
  bridge-net:
    driver: bridge
    internal: true
