name: CI/CD Pipeline

on:
  push:
    branches: [main, win-for-twin]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          
      - name: Run linter
        run: |
          pip install ruff
          ruff check backend/
          
      - name: Run type checker
        run: |
          pip install mypy
          cd backend && mypy app/
          
      - name: Run tests
        run: |
          cd backend && pytest --cov=app --cov-report=xml
          
      - name: Build Docker
        run: docker-compose build
        
  lint-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
          
      - name: Run frontend build
        run: |
          cd frontend
          npm run build
