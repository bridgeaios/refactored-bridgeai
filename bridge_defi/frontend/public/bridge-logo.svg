<!-- BRIDGE AI OS — High-Resolution SVG Logo (Scalable, Clean, Production Ready) -->
<svg width="2000" height="2000" viewBox="0 0 2000 2000" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="2000" height="2000" fill="#000000"/>

  <!-- Glow defs -->
  <defs>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Bridge Structure -->
  <!-- Left Pillar -->
  <rect x="500" y="600" width="120" height="700" fill="#1A1A1A"/>

  <!-- Right Pillar -->
  <rect x="1380" y="600" width="120" height="700" fill="#1A1A1A"/>

  <!-- Top Beam -->
  <rect x="620" y="600" width="760" height="80" fill="#FF0033" filter="url(#redGlow)"/>

  <!-- Base Platform -->
  <rect x="500" y="1300" width="1000" height="60" fill="#1A1A1A"/>

  <!-- Network Nodes -->
  <circle cx="700" cy="640" r="12" fill="#FF1A4D"/>
  <circle cx="1000" cy="640" r="12" fill="#FF1A4D"/>
  <circle cx="1300" cy="640" r="12" fill="#FF1A4D"/>

  <!-- Connection Lines -->
  <line x1="700" y1="640" x2="1000" y2="640" stroke="#FF0033" stroke-width="4"/>
  <line x1="1000" y1="640" x2="1300" y2="640" stroke="#FF0033" stroke-width="4"/>

  <!-- Pulse Line (AI signal) -->
  <polyline
    points="650,900 800,900 850,850 900,950 950,850 1000,900 1200,900"
    fill="none"
    stroke="#FF0033"
    stroke-width="6"
    filter="url(#redGlow)"
  />

  <!-- Title -->
  <text x="1000" y="1600" font-family="Inter, Arial, sans-serif" font-size="120" fill="#FFFFFF" text-anchor="middle">
    BRIDGE AI OS
  </text>

  <!-- Tagline -->
  <text x="1000" y="1700" font-family="JetBrains Mono, monospace" font-size="48" fill="#AAAAAA" text-anchor="middle">
    Autonomous Systems • Real-World Execution
  </text>

</svg>
