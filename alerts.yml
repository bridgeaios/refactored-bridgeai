groups:
  - name: bridge_ai_os
    rules:
      - alert: BackendDown
        expr: up{job="bridge-backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Bridge API is down"
          description: "Bridge API (port 8000) has been unreachable for 30 seconds."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on Bridge API"
          description: "More than 10% of requests are returning 5xx errors."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis (port 6379) has been unreachable for 30 seconds."
