<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF2B2B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .flow { stroke-dasharray: 10 10; animation: dash 2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -200; } }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#0A0A0A"/>
  <g>
    <circle cx="400" cy="400" r="260" stroke="#222" stroke-width="1" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="400" r="200" stroke="#333" stroke-width="1" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360 400 400" to="0 400 400" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="400" cy="400" r="55" fill="url(#core)" filter="url(#glow)">
    <animate attributeName="r" values="55;75;55" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <g stroke="url(#core)" stroke-width="2" class="flow">
    <line x1="400" y1="400" x2="400" y2="150"/>
    <line x1="400" y1="400" x2="650" y2="400"/>
    <line x1="400" y1="400" x2="400" y2="650"/>
    <line x1="400" y1="400" x2="150" y2="400"/>
  </g>
  <g fill="#00E5FF">
    <circle cx="400" cy="150" r="6">
      <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="400" r="6">
      <animate attributeName="r" values="6;12;6" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="650" r="6">
      <animate attributeName="r" values="6;12;6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="400" r="6">
      <animate attributeName="r" values="6;12;6" dur="2.9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="400" cy="120" r="4" fill="#FF2B2B">
      <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="400" r="4" fill="#FF2B2B">
      <animateTransform attributeName="transform" type="rotate" from="360 400 400" to="0 400 400" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="680" r="4" fill="#FF2B2B">
      <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="400" cy="400" r="100" stroke="#FF2B2B" stroke-width="2" fill="none" opacity="0.4">
    <animate attributeName="r" values="100;300;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="740" text-anchor="middle" fill="#FFFFFF" font-size="26" font-family="Orbitron, system-ui, sans-serif">BAN.OPS // AUTONOMOUS EXECUTION CORE</text>
</svg>
