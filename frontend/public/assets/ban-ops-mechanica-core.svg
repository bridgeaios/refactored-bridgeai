<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF2B2B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="pulseGrad">
      <stop offset="0%" stop-color="#FF2B2B" stop-opacity="1">
        <animate attributeName="stop-opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF2B2B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="#0A0A0A"/>
  <circle cx="400" cy="400" r="60" fill="url(#coreGrad)" filter="url(#glow)">
    <animate attributeName="r" values="60;75;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#5A5A5A" stroke-width="1" fill="none">
    <circle cx="400" cy="400" r="140">
      <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="400" r="220">
      <animateTransform attributeName="transform" type="rotate" from="360 400 400" to="0 400 400" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="400" r="300">
      <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="40s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#00E5FF">
    <circle cx="400" cy="260" r="6">
      <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="400" r="6">
      <animate attributeName="r" values="6;10;6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="540" r="6">
      <animate attributeName="r" values="6;10;6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="400" r="6">
      <animate attributeName="r" values="6;10;6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g stroke="url(#coreGrad)" stroke-width="2">
    <line x1="400" y1="400" x2="400" y2="260">
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="400" x2="540" y2="400">
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="400" x2="400" y2="540">
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="400" x2="260" y2="400">
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="2.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <circle cx="400" cy="400" r="120" fill="url(#pulseGrad)">
    <animate attributeName="r" values="120;300;120" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g>
    <circle cx="400" cy="180" r="4" fill="#FF2B2B">
      <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="400" r="4" fill="#FF2B2B">
      <animateTransform attributeName="transform" type="rotate" from="360 400 400" to="0 400 400" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="400" y="730" text-anchor="middle" fill="#FFFFFF" font-size="28" font-family="Orbitron, system-ui, sans-serif">BAN.OPs // MECHANICA CORE</text>
</svg>
