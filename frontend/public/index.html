<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.babylonjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https: blob:; connect-src 'self' ws: wss: https: http:; frame-src https:;">
    <title>BRIDGE AI OS Digital Twin</title>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #05070d; }
        body::before { content: ''; position: fixed; inset: 0; background: url('/bridge-connector.svg') center/60% no-repeat; opacity: 0.08; pointer-events: none; z-index: 0; }
        #renderCanvas { width: 100%; height: 100vh; touch-action: none; display: block; }
        #terminal { position: absolute; bottom: 0; left: 0; right: 260px; height: 180px; background: rgba(0,0,0,0.9); color: #cf8; padding: 12px; overflow-y: auto; font-family: monospace; font-size: 13px; }
        #side-panel { position: absolute; top: 10px; right: 10px; width: 240px; max-height: calc(100vh - 220px); overflow-y: auto; background: rgba(0,0,0,0.85); color: #8fc; padding: 10px; border-radius: 8px; font-size: 12px; }
        #side-panel h4 { margin: 8px 0 4px 0; font-size: 11px; text-transform: uppercase; color: #6af; }
        #missionBoard, #skillsPanel { margin-bottom: 12px; }
        #missionBoard { padding-bottom: 8px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <div id="loading" style="position:fixed;inset:0;background:#0a0c12;color:#8cf;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;font-size:18px;z-index:9999;">
        <img src="/bridge-connector.svg" alt="Bridge" style="width:120px;height:120px;opacity:0.6;margin-bottom:16px;">
        Loading Digital Twin...
    </div>
    <canvas id="renderCanvas"></canvas>
    <div id="terminal"></div>
    <div id="side-panel">
        <div id="missionBoard"></div>
        <div id="founderTodo"></div>

    </div>
