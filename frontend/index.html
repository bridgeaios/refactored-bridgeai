<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>if(typeof window.__API_BASE==="undefined")window.__API_BASE="";if(typeof window.__WS_BASE==="undefined")window.__WS_BASE="";</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.babylonjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https: blob:; connect-src 'self' ws: wss: https: http:; frame-src https:;">
    <title>BRIDGE AI OS Digital Twin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        :root {
            --bg-deep: #030712;
            --bg-panel: rgba(15, 23, 42, 0.92);
            --bg-panel-border: rgba(71, 85, 105, 0.4);
            --text-primary: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --accent-hover: #fbbf24;
            --terminal-bg: rgba(15, 23, 42, 0.95);
            --terminal-text: #a5f3fc;
            --terminal-border: rgba(34, 211, 238, 0.2);
        }
        body { margin: 0; overflow: hidden; background: var(--bg-deep); }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(30, 41, 59, 0.4) 0%, transparent 50%),
                        url('/bridge-connector.svg') center/55% no-repeat;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        #renderCanvas { width: 100%; height: 100vh; touch-action: none; display: block; }
        #terminal {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 260px;
            height: 180px;
            background: var(--terminal-bg);
            color: var(--terminal-text);
            padding: 14px 16px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.5;
            border-top: 1px solid var(--terminal-border);
            box-shadow: 0 -4px 24px rgba(0,0,0,0.3);
        }
        #side-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 248px;
            max-height: calc(100vh - 224px);
            overflow-y: auto;
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-primary);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--bg-panel-border);
            font-size: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        #side-panel h4 { margin: 10px 0 6px 0; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
        #side-panel a { border-radius: 8px; }
        #missionBoard, #skillsPanel { margin-bottom: 14px; }
        #missionBoard { padding-bottom: 10px; border-bottom: 1px solid var(--bg-panel-border); }
    </style>
</head>
<body>
    <div id="loading" style="position:fixed;inset:0;background:#030712;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;font-size:18px;font-weight:500;z-index:9999;">
        <img src="/bridge-connector.svg" alt="Bridge" style="width:120px;height:120px;opacity:0.7;margin-bottom:20px;filter:drop-shadow(0 0 24px rgba(245,158,11,0.2));">
        <span style="color:#94a3b8;margin-bottom:8px;">BRIDGE AI OS</span>
        <span>Loading Digital Twin…</span>
    </div>
    <canvas id="renderCanvas"></canvas>
    <div id="terminal"></div>
    <div id="side-panel">
        <div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(71,85,105,0.4)">
          <a href="/executive-dashboard.html" style="display:inline-block;padding:6px 10px;border-radius:8px;background:rgba(30,41,59,0.9);color:#e2e8f0;font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;margin-right:4px;margin-bottom:4px;transition:background .2s,color .2s" onmouseover="this.style.background='#334155';this.style.color='#fbbf24'" onmouseout="this.style.background='rgba(30,41,59,0.9)';this.style.color='#e2e8f0'">Dashboard</a>
          <a href="/agents.html" style="display:inline-block;padding:6px 10px;border-radius:8px;background:rgba(30,41,59,0.9);color:#e2e8f0;font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;margin-right:4px;margin-bottom:4px;transition:background .2s,color .2s" onmouseover="this.style.background='#334155';this.style.color='#fbbf24'" onmouseout="this.style.background='rgba(30,41,59,0.9)';this.style.color='#e2e8f0'">Agents</a>
          <a href="/settings.html" style="display:inline-block;padding:6px 10px;border-radius:8px;background:rgba(30,41,59,0.9);color:#e2e8f0;font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;margin-right:4px;margin-bottom:4px;transition:background .2s,color .2s" onmouseover="this.style.background='#334155';this.style.color='#fbbf24'" onmouseout="this.style.background='rgba(30,41,59,0.9)';this.style.color='#e2e8f0'">Settings</a>
          <a href="/docs.html" style="display:inline-block;padding:6px 10px;border-radius:8px;background:rgba(30,41,59,0.9);color:#e2e8f0;font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;margin-right:4px;margin-bottom:4px;transition:background .2s,color .2s" onmouseover="this.style.background='#334155';this.style.color='#fbbf24'" onmouseout="this.style.background='rgba(30,41,59,0.9)';this.style.color='#e2e8f0'">Docs</a>
          <a href="/50-applications.html" style="display:inline-block;padding:6px 10px;border-radius:8px;background:#f59e0b;color:#030712;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;margin-bottom:4px;transition:background .2s,box-shadow .2s" onmouseover="this.style.background='#fbbf24';this.style.boxShadow='0 0 20px rgba(245,158,11,0.35)'" onmouseout="this.style.background='#f59e0b';this.style.boxShadow=''">50 Applications</a>
          <a href="/gateway/" style="display:inline-block;padding:6px 10px;border-radius:8px;background:rgba(30,41,59,0.9);color:#e2e8f0;font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;margin-right:4px;margin-bottom:4px;transition:background .2s,color .2s" onmouseover="this.style.background='#334155';this.style.color='#fbbf24'" onmouseout="this.style.background='rgba(30,41,59,0.9)';this.style.color='#e2e8f0'">Gateway</a>
          <a href="/join.html" style="display:inline-block;padding:6px 10px;border-radius:8px;background:rgba(30,41,59,0.9);color:#e2e8f0;font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;margin-bottom:4px;transition:background .2s,color .2s" onmouseover="this.style.background='#334155';this.style.color='#fbbf24'" onmouseout="this.style.background='rgba(30,41,59,0.9)';this.style.color='#e2e8f0'">Join as Agent</a>
        </div>
        <div id="missionBoard"></div>
        <div id="founderTodo"></div>
        <div id="twinPanel"></div>
        <div id="skillsPanel"></div>
    </div>
    <script type="module" src="/src/main.js?v=18"></script>
