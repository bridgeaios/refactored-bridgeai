<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BRIDGE AI OS — Enter The System</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        /* ═══════════════════════════════════════════
           BRIDGE AI OS — IMMERSIVE LOGIN
           ═══════════════════════════════════════════ */
        :root {
            --bg-primary: #060810;
            --bg-secondary: #0a0e17;
            --bg-glass: rgba(10, 14, 23, 0.75);
            --bg-glass-hover: rgba(15, 20, 30, 0.85);
            --border-color: rgba(99, 255, 218, 0.12);
            --border-glow: rgba(99, 255, 218, 0.3);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-cyan: #63ffda;
            --accent-blue: #38bdf8;
            --accent-purple: #a78bfa;
            --accent-pink: #f472b6;
            --gradient-primary: linear-gradient(135deg, #63ffda 0%, #38bdf8 50%, #a78bfa 100%);
            --shadow-glow: 0 0 30px rgba(99, 255, 218, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            font-family: 'Outfit', -apple-system, sans-serif;
            color: var(--text-primary);
        }

        /* ── 3D Canvas Background ── */
        #renderCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            outline: none;
        }

        /* ── Animated gradient overlay ── */
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(99, 255, 218, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(167, 139, 250, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(56, 189, 248, 0.03) 0%, transparent 70%);
            animation: overlayPulse 8s ease-in-out infinite alternate;
        }

        @keyframes overlayPulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* ── Floating particles (CSS) ── */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent-cyan);
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat linear infinite;
        }
        @keyframes particleFloat {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 0.8; }
            90%  { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* ── Grid lines overlay ── */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(99, 255, 218, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 255, 218, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridScroll 20s linear infinite;
        }
        @keyframes gridScroll {
            0%   { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        /* ── Scan line ── */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            z-index: 3;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0.15;
            animation: scanMove 4s ease-in-out infinite;
        }
        @keyframes scanMove {
            0%, 100% { top: -2px; }
            50% { top: 100%; }
        }

        /* ── Main login container ── */
        .login-container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            perspective: 1200px;
        }

        /* ── Login card ── */
        .login-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            box-shadow:
                0 0 60px rgba(99, 255, 218, 0.06),
                0 25px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px) rotateX(8deg);
            transform-style: preserve-3d;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .login-card:hover {
            box-shadow:
                0 0 80px rgba(99, 255, 218, 0.1),
                0 30px 100px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        @keyframes cardEntrance {
            0%   { opacity: 0; transform: translateY(60px) rotateX(12deg) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
        }

        /* ── Glow ring around card ── */
        .login-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 25px;
            background: linear-gradient(135deg,
                rgba(99, 255, 218, 0.2),
                rgba(56, 189, 248, 0.1),
                rgba(167, 139, 250, 0.2),
                rgba(99, 255, 218, 0.1));
            background-size: 300% 300%;
            z-index: -1;
            animation: borderGlow 6s ease-in-out infinite;
            opacity: 0.6;
        }
        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        /* ── Animated corner accents ── */
        .login-card::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border-radius: 16px;
            border: 1px solid transparent;
            background: linear-gradient(var(--bg-glass), var(--bg-glass)) padding-box,
                        linear-gradient(135deg, rgba(99,255,218,0.08), transparent 40%, transparent 60%, rgba(167,139,250,0.08)) border-box;
            pointer-events: none;
        }

        /* ── Logo / Brand ── */
        .brand-section {
            text-align: center;
            margin-bottom: 36px;
            animation: fadeInUp 0.8s 0.3s ease both;
        }

        .logo-ring {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
        }
        .logo-ring .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
        }
        .logo-ring .ring:nth-child(1) {
            border-top-color: var(--accent-cyan);
            border-right-color: var(--accent-cyan);
            animation: spinRing 3s linear infinite;
        }
        .logo-ring .ring:nth-child(2) {
            inset: 8px;
            border-bottom-color: var(--accent-blue);
            border-left-color: var(--accent-blue);
            animation: spinRing 2s linear infinite reverse;
        }
        .logo-ring .ring:nth-child(3) {
            inset: 16px;
            border-top-color: var(--accent-purple);
            animation: spinRing 4s linear infinite;
        }
        .logo-ring .core {
            position: absolute;
            inset: 22px;
            background: radial-gradient(circle, var(--accent-cyan), transparent);
            border-radius: 50%;
            animation: corePulse 2s ease-in-out infinite;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }
        @keyframes corePulse {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50%      { opacity: 1; transform: scale(1.1); }
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }
        .brand-subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* ── Clerk mount target ── */
        #clerk-auth {
            animation: fadeInUp 0.8s 0.5s ease both;
        }

        /* ── Clerk styling overrides ── */
        #clerk-auth .cl-rootBox {
            width: 100%;
        }
        #clerk-auth .cl-card {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }
        #clerk-auth .cl-headerTitle,
        #clerk-auth .cl-headerSubtitle {
            display: none !important;
        }
        #clerk-auth .cl-formButtonPrimary {
            background: var(--gradient-primary) !important;
            border: none !important;
            border-radius: 12px !important;
            font-family: 'Outfit', sans-serif !important;
            font-weight: 600 !important;
            letter-spacing: 0.5px !important;
            height: 48px !important;
            font-size: 15px !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 4px 20px rgba(99, 255, 218, 0.2) !important;
        }
        #clerk-auth .cl-formButtonPrimary:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 8px 30px rgba(99, 255, 218, 0.35) !important;
        }
        #clerk-auth .cl-formFieldInput {
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px !important;
            color: var(--text-primary) !important;
            font-family: 'Outfit', sans-serif !important;
            height: 48px !important;
            padding: 0 16px !important;
            transition: all 0.3s ease !important;
        }
        #clerk-auth .cl-formFieldInput:focus {
            border-color: var(--accent-cyan) !important;
            box-shadow: 0 0 20px rgba(99, 255, 218, 0.1) !important;
            background: rgba(255, 255, 255, 0.06) !important;
        }
        #clerk-auth .cl-formFieldLabel {
            color: var(--text-secondary) !important;
            font-family: 'Outfit', sans-serif !important;
            font-size: 13px !important;
        }
        #clerk-auth .cl-footerActionLink {
            color: var(--accent-cyan) !important;
        }
        #clerk-auth .cl-socialButtonsBlockButton {
            background: rgba(255, 255, 255, 0.04) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px !important;
            color: var(--text-primary) !important;
            font-family: 'Outfit', sans-serif !important;
            height: 46px !important;
            transition: all 0.3s ease !important;
        }
        #clerk-auth .cl-socialButtonsBlockButton:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: var(--border-glow) !important;
            transform: translateY(-1px) !important;
        }
        #clerk-auth .cl-dividerLine {
            background: var(--border-color) !important;
        }
        #clerk-auth .cl-dividerText {
            color: var(--text-muted) !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 11px !important;
        }
        #clerk-auth .cl-footer {
            color: var(--text-muted) !important;
        }
        #clerk-auth .cl-internal {
            color: var(--text-secondary) !important;
        }

        /* ── Fallback form (shown if Clerk fails) ── */
        .fallback-form { display: none; }
        .fallback-form.active { display: block; }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .form-group input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(99, 255, 218, 0.1);
            background: rgba(255, 255, 255, 0.06);
        }
        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn-login {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: var(--gradient-primary);
            color: #060810;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(99, 255, 218, 0.2);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(99, 255, 218, 0.35);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        .btn-login:hover::after {
            transform: translateX(100%);
        }

        /* ── Status line ── */
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 10px 24px;
            background: rgba(6, 8, 16, 0.8);
            border-top: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            animation: fadeInUp 1s 1s ease both;
        }
        .status-bar .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            margin-right: 8px;
            animation: dotBlink 2s ease-in-out infinite;
        }
        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ── Typing text ── */
        .typing-text {
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid var(--accent-cyan);
            animation: typing 2s steps(30) 1.5s both, blinkCaret 0.8s step-end infinite;
            max-width: 0;
        }
        @keyframes typing {
            to { max-width: 500px; }
        }
        @keyframes blinkCaret {
            50% { border-color: transparent; }
        }

        /* ── Utility animations ── */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Floating orbs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(60px);
        }
        .orb-1 {
            width: 300px; height: 300px;
            background: rgba(99, 255, 218, 0.07);
            top: 10%; left: 5%;
            animation: orbFloat1 12s ease-in-out infinite;
        }
        .orb-2 {
            width: 250px; height: 250px;
            background: rgba(167, 139, 250, 0.06);
            bottom: 15%; right: 10%;
            animation: orbFloat2 15s ease-in-out infinite;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: rgba(56, 189, 248, 0.05);
            top: 50%; left: 60%;
            animation: orbFloat3 10s ease-in-out infinite;
        }
        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(40px, -30px) scale(1.1); }
            66%      { transform: translate(-20px, 20px) scale(0.9); }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-50px, -40px) scale(1.15); }
        }
        @keyframes orbFloat3 {
            0%, 100% { transform: translate(0, 0); }
            50%      { transform: translate(30px, 30px); }
        }

        /* ── Loading state ── */
        .loading-clerk {
            text-align: center;
            padding: 40px 0;
        }
        .loading-clerk .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            margin: 0 auto 12px;
            animation: spinRing 0.8s linear infinite;
        }
        .loading-clerk p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
                border-radius: 20px;
            }
            .brand-title { font-size: 22px; }
        }

        /* ── Reduced motion: disable all animations ── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .particles, .scanline, .grid-overlay { display: none; }
            .login-card { opacity: 1; transform: none; }
            #renderCanvas { display: none; }
            .orb { animation: none; }
        }

        /* ── Focus visible indicators ── */
        input:focus-visible, button:focus-visible, a:focus-visible {
            outline: 2px solid var(--accent-cyan);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <!-- 3D Background Canvas -->
    <canvas id="renderCanvas"></canvas>

    <!-- Atmospheric layers -->
    <div class="bg-overlay"></div>
    <div class="grid-overlay"></div>
    <div class="scanline"></div>

    <!-- Floating orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- CSS Particles -->
    <div class="particles" id="particles"></div>

    <!-- Login Card -->
    <div class="login-container">
        <div class="login-card" id="loginCard">
            <div class="brand-section">
                <div class="logo-ring">
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="core"></div>
                </div>
                <div class="brand-title">Bridge AI OS</div>
                <div class="brand-subtitle">Digital Twin Interface</div>
            </div>

            <!-- Clerk auth mounts here -->
            <div id="clerk-auth">
                <div class="loading-clerk" role="status" aria-live="polite">
                    <div class="spinner" aria-hidden="true"></div>
                    <p>Initializing secure auth...</p>
                </div>
            </div>

            <!-- Fallback if Clerk unavailable -->
            <div class="fallback-form" id="fallbackForm" role="form" aria-label="Sign in">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="operator@bridge.ai" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter passphrase" autocomplete="current-password" required>
                </div>
                <button class="btn-login" id="loginBtn">
                    Enter The System
                </button>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div>
            <span class="dot"></span>
            <span class="typing-text">BRIDGE_SYSTEM::AUTH_GATEWAY v2.1.0 — AWAITING CREDENTIALS</span>
        </div>
        <div>SECURE CHANNEL</div>
    </div>

    <script type="module" src="/src/login.js"></script>
</body>
</html>
