<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BridgeAI · Sign In</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#060810;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
    .card{background:#0f172a;border:1px solid #1e3a5f;border-radius:14px;padding:2.5rem 2rem;width:100%;max-width:420px;text-align:center}
    .logo{font-size:1.1rem;font-weight:800;letter-spacing:.15em;color:#63ffda;margin-bottom:.4rem}
    h1{font-size:1.5rem;font-weight:700;color:#f1f5f9;margin-bottom:.5rem}
    .subtitle{font-size:.85rem;color:#64748b;margin-bottom:2rem;line-height:1.5}
    .btn{width:100%;padding:.85rem 1.5rem;border-radius:8px;border:none;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:.75rem}
    .btn-wallet{background:#1e293b;color:#f1f5f9;border:1px solid #334155}
    .btn-wallet:hover:not(:disabled){background:#1e3a5f;border-color:#3b82f6}
    .btn-wallet:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:#0f172a;color:#63ffda;border:1px solid #1e3a5f}
    .btn-primary:hover:not(:disabled){background:#1e3a5f}
    .status{margin:.75rem 0;padding:.7rem 1rem;border-radius:6px;font-size:.82rem;text-align:left;line-height:1.5}
    .status:empty{display:none}
    .status.info{background:#0c4a6e;border:1px solid #0369a1;color:#7dd3fc}
    .status.error{background:#7f1d1d;border:1px solid #991b1b;color:#fca5a5}
    .status.success{background:#064e3b;border:1px solid #065f46;color:#34d399}
    .divider{display:flex;align-items:center;gap:.75rem;margin:1rem 0;color:#334155;font-size:.75rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:#1e293b}
    .address-display{background:#0f172a;border:1px solid #1e3a5f;border-radius:6px;padding:.5rem .75rem;font-size:.75rem;color:#63ffda;font-family:monospace;word-break:break-all;margin-bottom:.75rem}
    .footer-note{font-size:.72rem;color:#475569;margin-top:1.25rem;line-height:1.5}
    .footer-note a{color:#64748b}
    .spinner{width:16px;height:16px;border:2px solid rgba(99,255,218,.3);border-top-color:#63ffda;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;display:none}
    .btn.loading .spinner{display:inline-block}
    .btn.loading .btn-label{display:none}
    input{width:100%;background:#1e293b;border:1px solid #334155;border-radius:6px;padding:.5rem .75rem;color:#f1f5f9;font-size:.82rem;margin-bottom:.5rem}
    input:focus{outline:none;border-color:#3b82f6}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">BRIDGE AI</div>
  <h1>Sign In</h1>
  <p class="subtitle">Connect your Ethereum wallet to access the dashboard. No password required.</p>

  <div id="status" class="status" role="alert"></div>
  <div id="address-display" class="address-display" style="display:none"></div>

  <button class="btn btn-wallet" id="btn-metamask" onclick="connectWallet()">
    <div class="spinner"></div>
    <span class="btn-label" style="display:flex;align-items:center;gap:.6rem">
      <svg width="22" height="22" viewBox="0 0 35 33" fill="none" aria-hidden="true">
        <path d="M32.96 1L19.4 10.68l2.52-5.98L32.96 1z" fill="#E17726" stroke="#E17726" stroke-width=".25"/>
        <path d="M2.04 1l13.44 9.77-2.4-5.09L2.04 1z" fill="#E27625" stroke="#E27625" stroke-width=".25"/>
        <path d="M28.24 23.53l-3.61 5.52 7.73 2.13 2.22-7.52-6.34-.13zM.45 23.66l2.2 7.52 7.72-2.13-3.6-5.52-6.32.13z" fill="#E27625" stroke="#E27625" stroke-width=".25"/>
        <path d="M9.93 14.35l-2.16 3.27 7.7.35-.26-8.28-5.28 4.66zM25.07 14.35l-5.33-4.76-.17 8.38 7.67-.35-2.17-3.27z" fill="#E27625" stroke="#E27625" stroke-width=".25"/>
        <path d="M10.37 29.05l4.63-2.24-4-3.12-.63 5.36zM20 26.81l4.62 2.24-.62-5.36-4 3.12z" fill="#E27625" stroke="#E27625" stroke-width=".25"/>
      </svg>
      Connect MetaMask / Browser Wallet
    </span>
  </button>

  <div class="divider">or use dev credentials</div>

  <div id="dev-login">
    <input id="dev-addr" type="text" placeholder="Wallet address (0x…) or username" autocomplete="username" />
    <input id="dev-secret" type="password" placeholder="Dev secret (BRIDGE_DEV_SECRET)" autocomplete="current-password" />
    <button class="btn btn-primary" id="btn-dev" onclick="devLogin()">
      <div class="spinner"></div>
      <span class="btn-label">Sign In (Dev / Test)</span>
    </button>
  </div>

  <p class="footer-note">
    Your wallet address is your identity — no email or password stored.<br/>
    <a href="/public/landing.html">&#8592; Back to home</a>
  </p>
</div>

<script>
(function () {
  'use strict';

  var API = '';
  var REDIRECT = new URLSearchParams(location.search).get('next') || '/leads.html';

  // ── Helpers ──────────────────────────────────────────────────────────────

  function setStatus(msg, type) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + (type || '');
  }

  function setBusy(btnId, busy) {
    var btn = document.getElementById(btnId);
    if (!btn) return;
    btn.disabled = busy;
    if (busy) btn.classList.add('loading');
    else btn.classList.remove('loading');
  }

  function showAddress(addr) {
    var el = document.getElementById('address-display');
    el.textContent = 'Connected: ' + addr;
    el.style.display = 'block';
  }

  // ── Auto-redirect if token is valid ──────────────────────────────────────

  var stored = localStorage.getItem('bridge_token');
  if (stored) {
    fetch(API + '/api/auth/me', { headers: { Authorization: 'Bearer ' + stored } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && (d.sub || d.address)) window.location.href = REDIRECT; })
      .catch(function () {});
  }

  // ── MetaMask / injected wallet ────────────────────────────────────────────

  window.connectWallet = function () {
    setBusy('btn-metamask', true);
    setStatus('');

    if (!window.ethereum) {
      setStatus('No wallet detected. Install MetaMask at metamask.io or use a Web3 browser.', 'error');
      setBusy('btn-metamask', false);
      return;
    }

    window.ethereum.request({ method: 'eth_requestAccounts' })
      .then(function (accounts) {
        if (!accounts || !accounts.length) {
          setStatus('No accounts returned from wallet.', 'error');
          setBusy('btn-metamask', false);
          return;
        }
        doSiweLogin(accounts[0].toLowerCase());
      })
      .catch(function (e) {
        setStatus('Connection error: ' + (e.message || String(e)), 'error');
        setBusy('btn-metamask', false);
      });
  };

  function doSiweLogin(address) {
    var domain = location.hostname + (location.port ? ':' + location.port : '');
    var nonce = Date.now().toString();
    var message = 'Bridge AI OS Login\nDomain: ' + domain + '\nAddress: ' + address + '\nNonce: ' + nonce;

    setStatus('Waiting for wallet signature\u2026', 'info');

    window.ethereum.request({ method: 'personal_sign', params: [message, address] })
      .then(function (signature) {
        setStatus('Verifying\u2026', 'info');
        return fetch(API + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message, signature: signature }),
        });
      })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (r) {
        if (!r.ok) {
          setStatus('Login failed: ' + (r.data.detail || 'server error'), 'error');
          setBusy('btn-metamask', false);
          return;
        }
        var token = r.data.token || r.data.access_token;
        if (!token) {
          setStatus('Server returned no token. Check BRIDGE_SIWE_JWT_SECRET is configured.', 'error');
          setBusy('btn-metamask', false);
          return;
        }
        localStorage.setItem('bridge_token', token);
        localStorage.setItem('bridge_address', address);
        showAddress(address);
        setStatus('Signed in! Redirecting\u2026', 'success');
        setTimeout(function () { window.location.href = REDIRECT; }, 700);
      })
      .catch(function (e) {
        if (e && e.code === 4001) {
          setStatus('Signature cancelled. Approve the signing request in your wallet.', 'error');
        } else {
          setStatus('Error: ' + (e && e.message ? e.message : String(e)), 'error');
        }
        setBusy('btn-metamask', false);
      });
  }

  // ── Dev / test login ──────────────────────────────────────────────────────

  window.devLogin = function () {
    var addr = document.getElementById('dev-addr').value.trim();
    var secret = document.getElementById('dev-secret').value.trim();
    if (!addr || !secret) { setStatus('Address and secret required', 'error'); return; }

    setBusy('btn-dev', true);

    fetch(API + '/api/auth/dev-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address: addr, secret: secret }),
    })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
      .then(function (r) {
        if (!r.ok) { setStatus('Dev login failed: ' + (r.data.detail || 'error'), 'error'); setBusy('btn-dev', false); return; }
        var token = r.data.token || r.data.access_token;
        if (!token) { setStatus('No token returned', 'error'); setBusy('btn-dev', false); return; }
        localStorage.setItem('bridge_token', token);
        localStorage.setItem('bridge_address', addr);
        setStatus('Signed in! Redirecting\u2026', 'success');
        setTimeout(function () { window.location.href = REDIRECT; }, 600);
      })
      .catch(function (e) { setStatus('Error: ' + (e.message || String(e)), 'error'); setBusy('btn-dev', false); });
  };
}());
</script>
</body>
</html>
