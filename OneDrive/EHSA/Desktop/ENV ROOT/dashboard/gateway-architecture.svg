  <line class="accent-soft" x1="920" y1="340" x2="940" y2="340"/>
  <line class="accent-soft" x1="920" y1="390" x2="940" y2="390"/>
  <line class="accent-soft" x1="920" y1="440" x2="940" y2="440"/>

</svg>

