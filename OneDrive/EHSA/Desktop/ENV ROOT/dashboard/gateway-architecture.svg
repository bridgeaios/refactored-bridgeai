    Enforce EDGE_MODE=required at gateway
  </text>

  <rect class="panel" x="80" y="240" width="840" height="320"/>
  <text class="title" x="500" y="266" text-anchor="middle">ECONOMIC ENGINE</text>

  <rect class="panel-soft" x="110" y="290" width="220" height="240"/>
  <text class="label" x="220" y="312" text-anchor="middle">EXECUTION LAYER</text>

  <rect class="chip" x="135" y="330" width="170" height="34"/>
