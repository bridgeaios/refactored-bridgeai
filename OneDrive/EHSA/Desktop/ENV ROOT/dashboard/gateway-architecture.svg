<svg width="1200" height="650" viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill:#020913; }
      .panel { fill:#071824; stroke:#00ffd020; stroke-width:1.5; rx:10; ry:10; }
      .panel-soft { fill:#071824; stroke:#00ffd015; stroke-width:1.2; rx:8; ry:8; }
      .gateway { fill:#091e2c; stroke:#ffd070; stroke-width:2; rx:10; ry:10; }
      .title { fill:#00ffd0; font-family:'Share Tech Mono', monospace; font-size:14px; letter-spacing:4px; text-transform:uppercase; }
      .label { fill:#00ffd0; font-family:'Share Tech Mono', monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; }
      .text { fill:#eaeaea; font-family:'Share Tech Mono', monospace; font-size:11px; }
      .sub { fill:#00ffd080; font-family:'Share Tech Mono', monospace; font-size:10px; }
      .metric { fill:#ffffff; font-family:'Share Tech Mono', monospace; font-size:12px; }
      .small { fill:#00ffd060; font-family:'Share Tech Mono', monospace; font-size:9px; }
      .accent { stroke:#00ffd0; stroke-width:2; fill:none; }
      .accent-soft { stroke:#00ffd060; stroke-width:1.3; fill:none; stroke-dasharray:4 4; }
      .bar-bg { fill:#021824; stroke:#00ffd020; stroke-width:1; }
      .bar-agents { fill:#00ffd0; }
      .bar-treasury { fill:#ffd700; }
      .bar-reinvest { fill:#00ffa0; }
      .bar-ops { fill:#8080ff; }
      .bar-founder { fill:#ff8800; }
      .chip { fill:#071824; stroke:#00ffd030; stroke-width:1; rx:6; ry:6; }
      .chip-text { fill:#eaeaea; font-family:'Share Tech Mono', monospace; font-size:10px; }
      .callout { fill:#071824; stroke:#00ffd040; stroke-width:1; rx:6; ry:6; }
      .callout-text { fill:#00ffd0; font-family:'Share Tech Mono', monospace; font-size:9px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="650"/>

  <rect class="panel" x="80" y="40" width="1040" height="90"/>
