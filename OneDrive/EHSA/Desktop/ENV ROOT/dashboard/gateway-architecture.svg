  <rect class="gateway" x="260" y="150" width="680" height="70"/>
  <text class="title" x="600" y="176" text-anchor="middle">GATEWAY</text>
  <text class="small" x="360" y="198">Auth + Policy</text>
  <text class="small" x="530" y="198">Rate Limits</text>
  <text class="small" x="700" y="198">Logging</text>

  <line class="accent" x1="215" y1="120" x2="215" y2="150"/>
  <line class="accent" x1="415" y1="120" x2="415" y2="150"/>
  <line class="accent" x1="615" y1="120" x2="615" y2="150"/>
  <line class="accent" x1="835" y1="120" x2="835" y2="150"/>

  <rect class="callout" x="100" y="210" width="210" height="46"/>
