  <rect class="chip" x="380" y="330" width="90" height="30"/>
  <text class="chip-text" x="425" y="350" text-anchor="middle">executions</text>

  <rect class="chip" x="380" y="370" width="90" height="30"/>
  <text class="chip-text" x="425" y="390" text-anchor="middle">treasury</text>

  <rect class="chip" x="380" y="410" width="90" height="30"/>
  <text class="chip-text" x="425" y="430" text-anchor="middle">endpoint_usage</text>

  <text class="metric" x="490" y="348">TPS: 0.0050</text>
  <text class="metric" x="490" y="368">Daily Revenue: $86.40</text>
  <text class="metric" x="490" y="388">Total Calls: 3</text>
  <text class="metric" x="490" y="408">Total Tokens: 297</text>

  <rect class="panel-soft" x="640" y="290" width="260" height="240"/>
  <text class="label" x="770" y="312" text-anchor="middle">REVENUE ROUTING</text>

  <rect class="bar-bg" x="710" y="330" width="40" height="160"/>
  <rect class="bar-agents" x="710" y="330" width="40" height="96"/>
  <rect class="bar-treasury" x="710" y="426" width="40" height="32"/>
  <rect class="bar-reinvest" x="710" y="458" width="40" height="16"/>
  <rect class="bar-ops" x="710" y="474" width="40" height="11"/>
  <rect class="bar-founder" x="710" y="485" width="40" height="5"/>

  <text class="small" x="765" y="344">Agents 60%</text>
  <text class="small" x="765" y="364">Treasury 20%</text>
  <text class="small" x="765" y="384">Reinvest 10%</text>
  <text class="small" x="765" y="404">Ops 7%</text>
  <text class="small" x="765" y="424">Founder 3%</text>

  <line class="accent-soft" x1="305" y1="347" x2="380" y2="345"/>
  <line class="accent-soft" x1="305" y1="389" x2="380" y2="385"/>
  <line class="accent-soft" x1="305" y1="431" x2="380" y2="425"/>

  <rect class="panel-soft" x="110" y="540" width="220" height="60"/>
  <text class="label" x="220" y="562" text-anchor="middle">AGENTS (per_agent)</text>

  <rect class="panel-soft" x="360" y="540" width="220" height="60"/>
  <text class="label" x="470" y="562" text-anchor="middle">TREASURY RESERVE</text>

  <rect class="panel-soft" x="610" y="540" width="220" height="60"/>
  <text class="label" x="720" y="562" text-anchor="middle">REINVESTMENT POOL</text>

  <rect class="callout" x="380" y="470" width="210" height="42"/>
  <text class="callout-text" x="485" y="494" text-anchor="middle">
    Set ADMIN_API_TOKEN for /api/usage/bump
  </text>

  <rect class="callout" x="640" y="540" width="260" height="46"/>
  <text class="callout-text" x="770" y="566" text-anchor="middle">
    Configure AGENTS_JSON for per-agent revenue share
  </text>

  <rect class="panel" x="940" y="260" width="180" height="260"/>
  <text class="title" x="1030" y="286" text-anchor="middle">DASHBOARDS & WIZARDS</text>

  <rect class="chip" x="960" y="305" width="140" height="40"/>
  <text class="chip-text" x="1030" y="329" text-anchor="middle">Public</text>
  <text class="small" x="1030" y="343" text-anchor="middle">Generate demo activity</text>

  <rect class="chip" x="960" y="355" width="140" height="40"/>
  <text class="chip-text" x="1030" y="379" text-anchor="middle">Onboarding Wizard</text>
  <text class="small" x="1030" y="393" text-anchor="middle">Run distribution end-to-end</text>

  <rect class="chip" x="960" y="405" width="140" height="40"/>
