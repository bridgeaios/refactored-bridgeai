  <rect class="chip" x="140" y="80" width="150" height="40"/>
  <text class="chip-text" x="215" y="104" text-anchor="middle">USERS</text>

  <rect class="chip" x="340" y="80" width="150" height="40"/>
  <text class="chip-text" x="415" y="104" text-anchor="middle">APPS</text>

  <rect class="chip" x="540" y="80" width="150" height="40"/>
  <text class="chip-text" x="615" y="104" text-anchor="middle">AGENTS</text>

  <rect class="chip" x="740" y="80" width="190" height="40"/>
